<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />

    <!--
      Base href makes every relative asset + client route resolve correctly whether the app is
      served from the domain root ("/") or a subpath (e.g. GitHub Pages "/Ring-Tone-maker/").
      It is rewritten at load time to the directory this index.html is served from.
    -->
    <script>
      (function () {
        var p = location.pathname;
        // directory of the current document (strip a trailing file name if any)
        var dir = p.replace(/[^/]*$/, "");
        var b = document.createElement("base");
        b.href = dir;
        document.head.appendChild(b);
        // expose for the router
        window.__BASE_PATH__ = dir;
      })();
    </script>

    <!-- SEO: these are the defaults; each route overrides them at runtime via src/lib/seo.js -->
    <title>Ringtone Maker — Cut MP3 Ringtones in Your Browser</title>
    <meta name="description" content="Free browser-based MP3 cutter for phone ringtones. Upload audio, auto-split or cut by hand on a waveform, add fades, and download 320 kbps MP3s. 100% local — nothing is uploaded." />
    <link rel="canonical" href="./" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ringtone Maker" />
    <meta property="og:title" content="Ringtone Maker — Cut MP3 Ringtones in Your Browser" />
    <meta property="og:description" content="Free browser-based MP3 cutter for phone ringtones. 100% local — nothing is uploaded." />
    <meta property="og:image" content="og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ringtone Maker — Cut MP3 Ringtones in Your Browser" />
    <meta name="twitter:description" content="Free browser-based MP3 cutter for phone ringtones. 100% local — nothing is uploaded." />
    <meta name="twitter:image" content="og.svg" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/app.css" />

    <!--
      No build step. Runtime dependencies are resolved by the browser via this import map.
      (The build sandbox cannot reach the npm registry, so libraries load from a CDN in the
      user's browser instead. All audio processing still happens 100% locally.)
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.1.0",
          "react/": "https://esm.sh/react@19.1.0/",
          "react-dom": "https://esm.sh/react-dom@19.1.0",
          "react-dom/client": "https://esm.sh/react-dom@19.1.0/client",
          "htm": "https://esm.sh/htm@3.1.1",
          "wavesurfer": "https://esm.sh/wavesurfer.js@7.8.6/dist/wavesurfer.esm.js",
          "wavesurfer/regions": "https://esm.sh/wavesurfer.js@7.8.6/dist/plugins/regions.esm.js",
          "lamejs": "https://esm.sh/@breezystack/lamejs@1.2.7",
          "jszip": "https://esm.sh/jszip@3.10.1"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>Ringtone Maker needs JavaScript enabled to run in your browser.</noscript>
      <!-- Immediate loading state so the page is never blank while modules load -->
      <div id="boot" style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#e8ecf6;background:#0b1020;padding:24px;text-align:center">
        <div>
          <div style="width:44px;height:44px;margin:0 auto 16px;border-radius:50%;border:3px solid rgba(167,139,250,.3);border-top-color:#8b5cf6;animation:bootspin .8s linear infinite"></div>
          <div style="font-weight:700;font-size:1.1rem;background:linear-gradient(100deg,#8b5cf6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent">Ringtone Maker</div>
          <div id="boot-msg" style="color:#8b95b5;font-size:.9rem;margin-top:8px">Loading…</div>
        </div>
      </div>
      <style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
    </div>

    <!-- Boot diagnostics: if the module graph fails to load from the CDN, show WHY instead of a blank page. -->
    <script>
      window.__bootFail = function (msg) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#e8ecf6;background:#0b1020;padding:24px">' +
          '<div style="max-width:560px;text-align:center">' +
          '<div style="font-weight:800;font-size:1.4rem;margin-bottom:10px">Couldn\u2019t load the app</div>' +
          '<p style="color:#b4bdd6;line-height:1.6">Ringtone Maker loads its libraries (React, waveform, MP3 encoder) from a CDN the first time it opens. ' +
          'Your network, a firewall, or a content blocker appears to be blocking that CDN.</p>' +
          '<pre style="text-align:left;white-space:pre-wrap;background:#141b32;border:1px solid rgba(167,139,250,.2);border-radius:10px;padding:12px;color:#ffb0c1;font-size:.8rem;overflow:auto">' +
          String(msg).replace(/</g, "&lt;") + '</pre>' +
          '<button onclick="location.reload()" style="margin-top:14px;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;font-weight:700;color:#fff;background:linear-gradient(100deg,#8b5cf6,#22d3ee)">Reload</button>' +
          '<p style="color:#6b7599;font-size:.8rem;margin-top:14px">Tip: try another network, disable ad/script blockers for this page, or open it in a private window.</p>' +
          '</div></div>';
      };
      window.addEventListener("error", function (e) {
        if (e && e.message && /import|module|fetch|network/i.test(e.message)) window.__bootFail(e.message);
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e && e.reason; window.__bootFail((r && (r.message || r)) || "Unknown error");
      });
      // Safety net: if nothing rendered after 12s, assume the CDN import stalled.
      window.__bootTimer = setTimeout(function () {
        if (document.getElementById("boot")) window.__bootFail("Timed out loading libraries from the CDN (esm.sh). The CDN may be blocked or unreachable on this network.");
      }, 12000);
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
